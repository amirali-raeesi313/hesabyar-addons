<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>مسابقه خطبه فدکیه</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#102033;font-family:Vazirmatn,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}.app{width:min(100%,430px);aspect-ratio:9/16;min-height:720px;max-height:94vh;position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 14%,#194aa8 0,#0b2a61 25%,#071426 60%,#050b15 100%);box-shadow:0 20px 60px #0009;display:flex;flex-direction:column;padding:16px}.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;z-index:2}.bar{height:4px;background:#ffffff45;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:white}.head{z-index:2;margin:18px auto 8px;background:linear-gradient(135deg,#183b8d,#0b255c);border:1.5px solid #f6cf6a;border-radius:20px;padding:10px 24px;text-align:center;color:#fde68a;box-shadow:0 8px 24px #0006}.head b{font-family:Amiri,serif;font-size:26px;display:block}.head small{font-family:Amiri,serif;color:#fbd38d}.mount{z-index:2;flex:1;display:flex;align-items:center;justify-content:center}.card{width:100%;background:#fffffff3;border-radius:26px;padding:22px;box-shadow:0 18px 40px #0007}.title{font-size:25px;font-weight:900;line-height:1.7;text-align:center;margin:8px 0 12px}.sub{font-size:15px;font-weight:700;line-height:1.9;text-align:center;color:#475569}.q{font-size:18px;font-weight:900;line-height:2;margin:0 0 14px}.opts{display:flex;flex-direction:column;gap:10px}.opt{font:700 15px Vazirmatn;padding:14px;border-radius:17px;border:1px solid #dbe4ef;background:#fff;text-align:right;color:#1f2937;cursor:pointer;box-shadow:0 5px 14px #0002}.opt.correct{background:#dcfce7;border-color:#10b981;color:#065f46}.opt.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}.answer{margin-top:12px;border-radius:16px;padding:12px;background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;font-weight:800;line-height:1.8}.ex{margin-top:9px;border-radius:16px;padding:12px;background:#fff;border:1px solid #dbe4ef;color:#334155;font-size:13px;line-height:2}.btn{width:100%;border:0;border-radius:17px;padding:14px;background:linear-gradient(90deg,#153985,#081f50);color:#fbd36b;font:900 16px Vazirmatn;cursor:pointer}.score{font-size:52px;text-align:center;font-weight:900;color:#153985;margin:10px}.foot{z-index:2;text-align:center;color:#fde68a;font-size:11px;font-weight:700;padding:6px}.hint{z-index:2;color:#cbd5e1;text-align:center;font-size:11px;margin-top:3px}.hidden{display:none}</style></head><body><main class="app"><div class="bars" id="bars"></div><div class="head"><b>خطبه حضرت زهرا</b><small>سلام‌الله‌علیها</small></div><section class="mount" id="mount"></section><div class="hint">برای پاسخ، روی یکی از گزینه‌ها بزن</div><div class="foot">مسابقه خطبه فدکیه</div></main><script>const slides=[{t:'cover',title:'چقدر خطبه فدکیه رو می‌شناسیم؟',sub:'چند سؤال کوتاه؛ جواب بده و خودت رو محک بزن 👀'},{t:'q',q:'حضرت زهرا سلام‌الله‌علیها خطبه فدکیه را کجا ایراد کردند؟',o:['الف) در خانه','ب) در مسجد پیامبر ﷺ','ج) در کنار مزار پیامبر ﷺ'],c:1,a:'پاسخ: ب) در مسجد پیامبر ﷺ'},{t:'q',q:'آیا موضوع خطبه فدکیه فقط مطالبه «فدک» بود؟',o:['الف) بله','ب) خیر'],c:1,a:'پاسخ: خیر',e:'در این خطبه از توحید، نبوت، فلسفه احکام، جایگاه اهل‌بیت علیهم‌السلام و مسائل مهم جامعه پس از رحلت پیامبر ﷺ نیز سخن گفته شده است.'},{t:'q',q:'حضرت زهرا سلام‌الله‌علیها در خطبه، در مورد نماز چه فرمودند؟',o:['الف) دوری از تکبر','ب) افزایش رزق','ج) طول عمر'],c:0,a:'پاسخ: الف) دوری از تکبر'},{t:'q',q:'در خطبه فدکیه، حضرت زهرا سلام‌الله‌علیها برای اثبات حق خود به چه چیزی استدلال کردند؟',o:['الف) آیات قرآن','ب) نظر مردم','ج) رسم آن زمان'],c:0,a:'پاسخ: الف) آیات قرآن'},{t:'end'}];let i=0,score=0,locked=false;const m=document.getElementById('mount'),bars=document.getElementById('bars');slides.forEach((_,x)=>{const b=document.createElement('div');b.className='bar';b.innerHTML='<i id="b'+x+'"></i>';bars.appendChild(b)});function paintBars(){slides.forEach((_,x)=>document.getElementById('b'+x).style.width=x<=i?'100%':'0%')}function show(){locked=false;paintBars();const s=slides[i];if(s.t==='cover'){m.innerHTML='<div class="card"><div class="title">'+s.title+'</div><div class="sub">'+s.sub+'</div><br><button class="btn" onclick="next()">شروع مسابقه</button></div>'}else if(s.t==='q'){m.innerHTML='<div class="card"><div class="q">❓ '+s.q+'</div><div class="opts">'+s.o.map((x,k)=>'<button class="opt" id="o'+k+'" onclick="pick('+k+')">'+x+'</button>').join('')+'</div><div id="res"></div></div>'}else{m.innerHTML='<div class="card"><div class="title">نتیجه شما</div><div class="score">'+score+' از ۴</div><div class="sub">مسابقه رو برای بقیه هم بفرست 👇</div><br><button class="btn" onclick="restart()">دوباره بازی کن</button></div>'}}function pick(k){if(locked)return;locked=true;const s=slides[i];if(k===s.c)score++;s.o.forEach((_,x)=>{const el=document.getElementById('o'+x);if(x===s.c)el.classList.add('correct');else if(x===k)el.classList.add('wrong');el.disabled=true});document.getElementById('res').innerHTML='<div class="answer">✅ '+s.a+'</div>'+(s.e?'<div class="ex">'+s.e+'</div>':'')+'<br><button class="btn" onclick="next()">سؤال بعدی</button>'}function next(){if(i<slides.length-1)i++;show()}function restart(){i=0;score=0;show()}show();</script></body></html>
